name: Build ALRADHY Discovery Universe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Step 1 - Validate & Lint Check
        run: gradle lintDebug --stacktrace

      - name: Step 2 - Assemble Debug APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ALRADHY-Discovery-Universe.apk

      - name: Step 3 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALRADHY-Discovery-Universe-APK
          path: ALRADHY-Discovery-Universe.apk

      - name: Step 4 - Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ALRADHY Discovery Universe v1.0.${{ github.run_number }}"
          files: ALRADHY-Discovery-Universe.apk
