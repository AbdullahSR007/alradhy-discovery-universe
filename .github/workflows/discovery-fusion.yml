name: Build ALRADHY Discovery Museum V0.5 APK

on:
  push:
    branches:
      - feature/discovery-museum-v05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V0.5 museum branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK and Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fLsS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          curl -fLsS https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Verify physics equations and assumptions
        run: python3 scripts/check_science_models.py
      - name: Build interactive museum APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk ALRADHY-Discovery-Museum-V05.apk
          test -s ALRADHY-Discovery-Museum-V05.apk
          sha256sum ALRADHY-Discovery-Museum-V05.apk
      - name: Upload Fusion artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALRADHY-Discovery-Museum-V05-APK
          path: ALRADHY-Discovery-Museum-V05.apk
      - name: Publish Fusion preview prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "discovery-museum-v0.5.${{ github.run_number }}" ALRADHY-Discovery-Museum-V05.apk \
            --target "$GITHUB_SHA" \
            --title "ALRADHY Discovery Museum V0.5 - 15 Interactive Science Labs" \
            --notes "Museum V0.5 preview: 15 physics labs, guided/discovery modes, comparison snapshots, 12 graphs, direct mouse/remote manipulation, history and modern uses, persisted progress. CI scientific sanity tests. New app ID protects older versions. Debug signed; device QA pending." \
            --prerelease
