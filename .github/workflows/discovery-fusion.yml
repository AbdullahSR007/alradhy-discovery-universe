name: Build ALRADHY Discovery 15 Labs APK

on:
  push:
    branches:
      - feature/discovery-15-interactive-labs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 15-labs branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK and Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fLsS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          curl -fLsS https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build 15 Labs Android TV APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk ALRADHY-Discovery-15-Labs.apk
          test -s ALRADHY-Discovery-15-Labs.apk
          sha256sum ALRADHY-Discovery-15-Labs.apk
      - name: Upload Fusion artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALRADHY-Discovery-15-Labs-APK
          path: ALRADHY-Discovery-15-Labs.apk
      - name: Publish Fusion preview prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "discovery-15-labs-v0.4.${{ github.run_number }}" ALRADHY-Discovery-15-Labs.apk \
            --target "$GITHUB_SHA" \
            --title "ALRADHY Discovery 15 Labs - Interactive Science Universe" \
            --notes "Coulomb charge-control fix: q1 and q2 polarity, zero, numeric steps and responsive force-vector arrows. Fifteen differentiated interactive physics models: Galileo, Roemer, Fizeau plus twelve distinct labs (prism, Foucault, Coulomb, orbit, double slit, buoyancy, Faraday, Ohm, Kepler, Doppler, pendulum, photoelectric effect); 50 stations, offline educational models. New app ID preserves old installations. Debug signed, device test pending." \
            --prerelease
