name: Build ALRADHY Discovery Science Android TV

on:
  push:
    branches: [feature/science-museum-v1]
  workflow_dispatch:

concurrency:
  group: science-museum-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/feature/science-museum-v1'
    runs-on: ubuntu-24.04
    env:
      APK: ALRADHY-Discovery-Science-Android-TV-v1.0.0.apk
      BASELINE_CERT: 07ebe30363308176995207c325f66a3986e30f73b88e7400b65f40be95163c4c
      BASELINE_PACKAGE: com.alradhy.discovery15labs.museumv05
      BASELINE_VERSION: '14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Validate exhibit content and models
        run: |
          set -euo pipefail
          python3 scripts/check_content.py
          python3 scripts/check_science_models.py
          mkdir -p "$RUNNER_TEMP/physics"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/physics" \
            app/src/main/java/com/alradhy/discoverylab/{PhysicsModels,LabCatalog,ScienceExtensions}.java scripts/PhysicsCheck.java
          java -cp "$RUNNER_TEMP/physics" PhysicsCheck
      - name: Build with the installed application's signing key
        env:
          KEYSTORE_B64: ${{ secrets.ALRADHY_KEYSTORE_B64 }}
          ALRADHY_KEYSTORE_PASSWORD: ${{ secrets.ALRADHY_KEYSTORE_PASSWORD }}
          ALRADHY_KEY_ALIAS: ${{ secrets.ALRADHY_KEY_ALIAS }}
          ALRADHY_KEY_PASSWORD: ${{ secrets.ALRADHY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing signing keystore}" "${ALRADHY_KEYSTORE_PASSWORD:?Missing keystore password}" \
            "${ALRADHY_KEY_ALIAS:?Missing key alias}" "${ALRADHY_KEY_PASSWORD:?Missing key password}"
          export ALRADHY_KEYSTORE_FILE="$RUNNER_TEMP/museum-signing.jks"
          trap 'rm -f "$ALRADHY_KEYSTORE_FILE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ALRADHY_KEYSTORE_FILE"
          gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify the final APK against the installed baseline
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          badging=$("$build_tools/aapt2" dump badging "$APK")
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")
          code=$(sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$badging")
          version=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          certs=$("$build_tools/apksigner" verify --print-certs "$APK")
          certificate=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$certs")
          [[ "$package" == "$BASELINE_PACKAGE" ]]
          [[ "$code" =~ ^[0-9]+$ && "$code" -gt "$BASELINE_VERSION" ]]
          [[ "$version" == '1.0.0-science' ]]
          [[ "$certificate" == "$BASELINE_CERT" ]]
          ! grep -q '^application-debuggable' <<< "$badging"
          sha256sum "$APK" | tee museum-sha256.txt
          printf 'Package %s\nVersion %s (%s)\nSigning certificate SHA-256 %s\n' "$package" "$version" "$code" "$certificate"
      - name: Upload verified Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: ALRADHY-Discovery-Science-Android-TV-v1.0.0
          path: |
            ${{ env.APK }}
            museum-sha256.txt
          if-no-files-found: error
      - name: Publish the Android TV prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "science-museum-v1.0.0-b$GITHUB_RUN_NUMBER" "$APK" museum-sha256.txt \
            --target "$GITHUB_SHA" \
            --title "ALRADHY Discovery Science 1.0.0 for Android TV" \
            --notes "Seven science wings, 56 interactive experiments, and a telecom workbench for link budget, Fresnel clearance, QAM and satellite latency. Signed APK verified against the Android TV versionCode 14 baseline. Physical-device QA pending." \
            --prerelease
