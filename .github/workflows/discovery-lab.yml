name: Build Independent ALRADHY Discovery Lab APK

on:
  push:
    branches:
      - feature/discovery-lab-v1-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ChatGPT lab branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fLsS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          curl -fLsS https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Compile standalone native TV app
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify compiled APK and archive
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk ALRADHY-Discovery-Lab-ChatGPT.apk
          test -s ALRADHY-Discovery-Lab-ChatGPT.apk
          sha256sum ALRADHY-Discovery-Lab-ChatGPT.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALRADHY-Discovery-Lab-ChatGPT
          path: ALRADHY-Discovery-Lab-ChatGPT.apk

      - name: Publish APK as separate prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "lab-chatgpt-v0.1.${{ github.run_number }}" \
            ALRADHY-Discovery-Lab-ChatGPT.apk \
            --target "$GITHUB_SHA" \
            --title "ALRADHY Discovery Lab - independent ChatGPT prototype" \
            --notes "Independent Android TV APK. Application ID: com.alradhy.discoverylab. Five history scenes and a native interactive Fizeau laboratory. Installs alongside Gemini build, without replacing it. Debug signed test APK; update signature is not guaranteed between cloud runs." \
            --prerelease