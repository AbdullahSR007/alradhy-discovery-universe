plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alradhy.discovery'
    compileSdk 34

    defaultConfig {
        applicationId "com.alradhy.discovery15labs.museumv05"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "0.7.0-museum"
    }

    // Stable signing: when the key is provided (CI secrets) every build carries the SAME
    // certificate, which is what lets Android install a new APK as an update over the old one.
    def stableKeystore = System.getenv("ALRADHY_KEYSTORE_FILE")
    signingConfigs {
        stable {
            if (stableKeystore) {
                storeFile file(stableKeystore)
                storePassword System.getenv("ALRADHY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ALRADHY_KEY_ALIAS")
                keyPassword System.getenv("ALRADHY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (stableKeystore) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
