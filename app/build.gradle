plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alradhy.discovery'
    compileSdk 34

    defaultConfig {
        applicationId "com.alradhy.discovery15labs"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "0.4.0-15-labs"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
